<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Undangan — Zhald Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Cinzel+Decorative:wght@400&family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root{
      --deep:#6a3d78; --rich:#8a5296; --mid:#b97aa8; --pink:#e3aed0; --pale:#f6dcee;
      --gold:#c9a06a; --gold2:#e3bf8c;
      --white:#fff; --white-cream:#faf1f6;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:30px 16px;font-family:'Montserrat',sans-serif;
      background:linear-gradient(150deg,#3a1f42 0%,#6a3d78 55%,#b97aa8 100%);
    }
    .card{width:100%;max-width:480px;background:rgba(255,255,255,.09);border:1px solid rgba(227,191,140,.45);backdrop-filter:blur(20px);padding:44px 36px 40px;position:relative;border-radius:6px;}
    .card::before,.card::after{content:'';position:absolute;width:36px;height:36px;border-color:var(--gold);border-style:solid;}
    .card::before{top:10px;left:10px;border-width:2px 0 0 2px;}
    .card::after{bottom:10px;right:10px;border-width:0 2px 2px 0;}
    .logo{font-family:'Great Vibes',cursive;font-size:2.4rem;color:var(--gold2);text-align:center;margin-bottom:4px;}
    .subtitle{font-family:'Cinzel Decorative',serif;font-size:.6rem;letter-spacing:4px;color:var(--pale);text-align:center;text-transform:uppercase;margin-bottom:30px;}
    .divider{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
    .divider-line{flex:1;height:1px;background:linear-gradient(to right,transparent,var(--gold));}
    .divider-line.r{background:linear-gradient(to left,transparent,var(--gold));}
    .divider-diamond{width:7px;height:7px;background:var(--gold);transform:rotate(45deg);}
    .field{margin-bottom:18px;}
    .field label{display:block;font-size:.58rem;letter-spacing:3px;text-transform:uppercase;color:var(--gold2);margin-bottom:7px;}
    .field input{width:100%;padding:13px 16px;background:rgba(255,255,255,.1);border:1px solid rgba(227,191,140,.35);border-radius:4px;color:var(--white);font-family:'Montserrat',sans-serif;font-size:.82rem;outline:none;transition:border-color .3s;}
    .field input:focus{border-color:var(--gold);}
    .field input::placeholder{color:rgba(246,220,238,.45);}
    .btn-gen{width:100%;padding:16px;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:4px;color:#3a1f42;font-family:'Montserrat',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:4px;text-transform:uppercase;cursor:pointer;transition:all .3s;position:relative;overflow:hidden;margin-top:6px;}
    .btn-gen:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(201,160,106,.45);}
    .btn-gen::before{content:'';position:absolute;top:-50%;left:-60%;width:60%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);transform:skewX(-20deg);animation:shine 2.5s ease infinite;}
    @keyframes shine{0%{left:-60%}100%{left:120%}}
    .result-box{margin-top:22px;padding:18px;background:rgba(255,255,255,.1);border:1px solid rgba(227,191,140,.35);border-radius:4px;display:none;}
    .result-box.show{display:block;animation:fadeUp .4s ease;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .result-label{font-size:.55rem;letter-spacing:3px;text-transform:uppercase;color:var(--gold2);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
    .result-link{width:100%;padding:11px 14px;background:rgba(0,0,0,.22);border:1px solid rgba(227,191,140,.25);border-radius:4px;color:var(--pale);font-family:'Montserrat',sans-serif;font-size:.72rem;word-break:break-all;cursor:text;outline:none;}
    .result-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
    .btn-a{flex:1 1 45%;min-width:120px;padding:11px;border:none;border-radius:4px;cursor:pointer;font-family:'Montserrat',sans-serif;font-size:.6rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .3s;text-decoration:none;}
    .btn-copy{background:rgba(227,191,140,.2);border:1px solid rgba(227,191,140,.4);color:var(--gold2);}
    .btn-copy:hover{background:rgba(227,191,140,.35);}
    .btn-open{background:var(--rich);color:var(--white);}
    .btn-open:hover{background:var(--mid);}
    .btn-wa{background:#25d366;color:#fff;}
    .btn-wa:hover{background:#1ebe5b;}
    .btn-ig{background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7);color:#fff;}
    .btn-ig:hover{filter:brightness(1.08);}
    .toast{position:fixed;top:20px;right:20px;left:20px;max-width:360px;margin-left:auto;z-index:9999;padding:12px 20px;background:linear-gradient(135deg,var(--rich),var(--mid));border:1px solid var(--gold);border-radius:4px;color:var(--white);font-size:.72rem;display:flex;align-items:center;gap:8px;box-shadow:0 6px 24px rgba(0,0,0,.4);animation:toastIn .4s ease;}
    .toast.out{animation:toastOut .4s ease forwards;}
    @keyframes toastIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
    @keyframes toastOut{from{transform:translateX(0);opacity:1}to{transform:translateX(110%);opacity:0}}
    .footer-note{margin-top:28px;text-align:center;font-family:'Cormorant Garamond',serif;font-size:.8rem;color:rgba(246,220,238,.5);font-style:italic;}
    .footer-note a{color:var(--gold2);text-decoration:none;}
    .ig-hint{margin-top:8px;font-size:.65rem;color:rgba(246,220,238,.55);text-align:center;font-family:'Montserrat',sans-serif;line-height:1.5;display:none;}
    .ig-hint.show{display:block;}
  </style>
</head>
<body>

<div class="card">
  <div class="logo">Zhald Design</div>
  <div class="subtitle">Generator Link Undangan</div>

  <div class="divider">
    <span class="divider-line"></span>
    <span class="divider-diamond"></span>
    <span class="divider-line r"></span>
  </div>

  <div class="field">
    <label><i class="fas fa-user"></i> &nbsp;Nama Tamu Undangan</label>
    <input type="text" id="namaInput" placeholder="cth: Bapak Ahmad Santoso" autocomplete="off">
  </div>

  <button class="btn-gen" onclick="generate()">
    <i class="fas fa-link"></i> &nbsp; Generate Link Undangan
  </button>

  <div class="result-box" id="resultBox">
    <div class="result-label">
      <i class="fas fa-check-circle" style="color:var(--gold)"></i>
      Link Undangan Berhasil Dibuat
    </div>
    <input type="text" class="result-link" id="resultLink" readonly>

    <div class="result-actions">
      <button class="btn-a btn-copy" onclick="copyLink()">
        <i class="fas fa-copy"></i> Salin Link
      </button>
      <a class="btn-a btn-open" id="btnOpen" href="#" target="_blank">
        <i class="fas fa-eye"></i> Buka
      </a>
      <a class="btn-a btn-wa" id="btnWa" href="#" target="_blank">
        <i class="fab fa-whatsapp"></i> Bagikan WA
      </a>
      <button class="btn-a btn-ig" id="btnIg" onclick="shareInstagram()">
        <i class="fab fa-instagram"></i> Bagikan IG
      </button>
    </div>
    <p class="ig-hint" id="igHint">
      <i class="fas fa-info-circle"></i> Link sudah disalin. Buka Instagram → tempel (paste) link ini di caption Story/DM/Bio kamu.
    </p>
  </div>

  <p class="footer-note">
    &copy; 2025 <a href="https://wa.me/6281338596854" target="_blank">Zhald_Design</a>
    &nbsp;·&nbsp;
    <a href="https://instagram.com/rijaldelimanafe" target="_blank">@rijaldelimanafe</a>
  </p>
</div>

<script>
  let currentLink = '';
  let currentNama = '';

  function generate() {
    const nama = document.getElementById('namaInput').value.trim();
    if (!nama) { toast('⚠️ Masukkan nama tamu terlebih dahulu!'); return; }
    currentNama = nama;
    const encoded = encodeURIComponent(nama);
    const base = window.location.href.replace('generator.html', 'index.html').split('?')[0];
    currentLink = base + '?tamu=' + encoded;

    document.getElementById('resultLink').value = currentLink;
    document.getElementById('btnOpen').href = currentLink;

    // Tombol WhatsApp: buka WA dengan pesan + link siap kirim
    const waText = `Assalamu'alaikum/Om Swastyastu 🙏\n\nDengan penuh sukacita, kami mengundang *${nama}* untuk hadir di acara pernikahan kami.\n\nBerikut link undangan digital kami:\n${currentLink}\n\nMohon doa restu & kehadirannya 🌸`;
    document.getElementById('btnWa').href = 'https://wa.me/?text=' + encodeURIComponent(waText);

    document.getElementById('igHint').classList.remove('show');
    document.getElementById('resultBox').classList.add('show');
  }

  function copyLink() {
    if (!currentLink) return;
    navigator.clipboard.writeText(currentLink).then(() => toast('✅ Link berhasil disalin!')).catch(() => {
      const el = document.getElementById('resultLink');
      el.select(); el.setSelectionRange(0, 9999);
      document.execCommand('copy');
      toast('✅ Link berhasil disalin!');
    });
  }

  // Instagram tidak punya URL resmi untuk share link + teks otomatis.
  // Strategi: pakai Web Share API (muncul opsi Instagram di HP) kalau didukung,
  // kalau tidak, otomatis salin link & tampilkan panduan tempel manual.
  async function shareInstagram() {
    if (!currentLink) return;
    const shareText = `Undangan Pernikahan ${currentNama ? 'untuk ' + currentNama : ''}`.trim();

    if (navigator.share) {
      try {
        await navigator.share({ title: 'Undangan Pernikahan', text: shareText, url: currentLink });
        return;
      } catch (err) {
        // user membatalkan share sheet, lanjut ke fallback di bawah tanpa error
        if (err && err.name === 'AbortError') return;
      }
    }

    // Fallback: salin link + tampilkan instruksi
    try {
      await navigator.clipboard.writeText(currentLink);
    } catch (e) {
      const el = document.getElementById('resultLink');
      el.select(); el.setSelectionRange(0, 9999);
      document.execCommand('copy');
    }
    document.getElementById('igHint').classList.add('show');
    toast('📋 Link disalin! Tempel di Instagram kamu.');
    window.open('https://instagram.com', '_blank');
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('namaInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') generate();
    });
  });

  function toast(msg) {
    const old = document.querySelector('.toast');
    if (old) old.remove();
    const t = document.createElement('div');
    t.className = 'toast'; t.innerHTML = msg;
    document.body.appendChild(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 400); }, 3000);
  }
</script>
</body>
</html>
